# Builds the website from content/*.yml and publishes it on GitHub Pages.
# Runs on every change to main. If the content check fails, the live site stays as it was.
name: Website veröffentlichen

on:
  push:
    branches: [main]
    paths-ignore: ["worker/**", "docs/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inhalte prüfen
        run: npm run validate
      - id: pages
        uses: actions/configure-pages@v6
      - name: Website bauen
        run: npx eleventy
        env:
          # "" with a custom domain, "/<repo>" on <user>.github.io/<repo>/
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
